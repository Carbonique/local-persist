name: CI

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["linux/amd64", "linux/arm64", "linux/arm/v7"]
        include:
        - arch-short: amd64
          qemu-platform: amd64
          arch: linux/amd64
        - arch-short: arm64
          qemu-platform: arm64
          arch: linux/arm64
        - arch-short: armv7
          qemu-platform: arm
          arch: linux/arm/v7
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Go Mod
        run: go mod download && go mod vendor

      - name: Unit Tests
        run: go test ./driver/

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu-platform}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build rootfs
        run: sudo ./scripts/build.sh ${{ matrix.arch }}

      - name: Install plugin
        run: sudo ./scripts/install.sh CI-${{ steps.vars.outputs.tag }}-${{ matrix.arch-short }}

      - name: Test plugin
        run: sudo ./scripts/integration_test.sh CI-${{ steps.vars.outputs.tag }}-${{ matrix.arch-short }}

      - name: Push plugin
        run: docker plugin push ghcr.io/carbonique/local-persist:CI-${{ steps.vars.outputs.tag }}-${{ matrix.arch-short}}

